name: Feature request
description: Suggest an improvement to the research website.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Requested behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How will we know it works?
      description: Describe the expected result or user flow.
