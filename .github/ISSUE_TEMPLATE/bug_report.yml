name: Website bug
description: Report a broken page or interaction in Gaplab.
title: '[Bug] '
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://gaplab-mnq-research.creamcedar20.chatgpt.site/#timeframes
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include selected strategy, timeframe, entry window, research period, and dataset when relevant.
      placeholder: '1. Open the Timeframe study page...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the error text or attach a screenshot. Do not include account credentials or API keys.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Safari on macOS, Chrome on Windows, etc.
